name: Hosting Lab Deploy

on:
  workflow_dispatch:
    inputs:
      deployment_mode:
        description: "Select deployment mode"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - live

permissions:
  contents: read

concurrency:
  group: hosting-lab-development
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate required public files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f release-manifest.json
          test -f assets/styles.css
          test -f assets/app.js
          python -m json.tool release-manifest.json >/dev/null

  deploy:
    name: Deploy to cPanel
    needs: validate
    runs-on: ubuntu-latest
    environment: hosting-lab-development

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Preview synchronization
        if: ${{ inputs.deployment_mode == 'dry-run' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL }}
          port: ${{ secrets.FTP_PORT }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dry-run: true
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/docs/**
            **/releases/**
            README.md
            DEPLOYMENT-CHECKLIST.txt

      - name: Live synchronization
        if: ${{ inputs.deployment_mode == 'live' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL }}
          port: ${{ secrets.FTP_PORT }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/docs/**
            **/releases/**
            README.md
            DEPLOYMENT-CHECKLIST.txt

  verify:
    name: Verify public site
    if: ${{ inputs.deployment_mode == 'live' }}
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Wait for server synchronization
        run: sleep 10

      - name: Verify manifest and page
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 5 \
            https://hosting-lab.gridshelp.us/release-manifest.json \
            | python -m json.tool >/dev/null

          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 5 \
            https://hosting-lab.gridshelp.us/ \
            | grep -q "GridzHelp Hosting Lab"
