name: Hosting Lab Deploy

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List changes without uploading them"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: hosting-lab-development
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate required public files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f release-manifest.json
          test -f assets/styles.css
          test -f assets/app.js
          python -m json.tool release-manifest.json >/dev/null

  deploy:
    name: Deploy to cPanel
    needs: validate
    runs-on: ubuntu-latest
    environment: hosting-lab-development
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Synchronize public files
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL }}
          port: ${{ secrets.FTP_PORT }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dry-run: ${{ inputs.dry_run }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/docs/**
            **/releases/**
            README.md
            DEPLOYMENT-CHECKLIST.txt

  verify:
    name: Verify public site
    if: ${{ !inputs.dry_run }}
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for server synchronization
        run: sleep 10

      - name: Verify manifest and page
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location             --retry 3 --retry-delay 5             https://hosting-lab.gridshelp.us/release-manifest.json             | python -m json.tool >/dev/null

          curl --fail --silent --show-error --location             --retry 3 --retry-delay 5             https://hosting-lab.gridshelp.us/             | grep -q "GridzHelp Hosting Lab"
